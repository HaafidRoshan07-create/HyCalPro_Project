<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HycalPro Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #263238;
        }

        /* HEADER */
        header {
            background: linear-gradient(135deg, #5b4be7, #7957ee);
            color: white;
            padding: 25px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .user-name {
            font-size: 16px;
        }

        /* MAIN */
        main {
            width: 90%;
            max-width: 1100px;
            margin: 35px auto;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h1 {
            font-size: 30px;
            margin-bottom: 7px;
        }

        .welcome p {
            color: #777;
        }

        /* SUMMARY CARDS */
        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        }

        .card-title {
            color: #777;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .card-value {
            font-size: 28px;
            font-weight: bold;
        }

        .water {
            font-size: 28px;
        }

        /* PROFILE */
        .profile {
            background: white;
            padding: 25px;
            border-radius: 18px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        }

        .profile h2 {
            margin-bottom: 20px;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .profile-item {
            background: #f7f7fb;
            padding: 15px;
            border-radius: 12px;
        }

        .profile-item span {
            display: block;
            color: #777;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .profile-item strong {
            font-size: 17px;
        }

        /* ROUTINE */
        .routine {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        }

        .routine-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .routine-header h2 {
            font-size: 22px;
        }

        .add-btn {
            background: #6754e8;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 40px 20px;
            color: #888;
        }

        .empty-icon {
            font-size: 45px;
            margin-bottom: 12px;
        }

        /* RESPONSIVE */
        @media (max-width: 750px) {

            .cards {
                grid-template-columns: 1fr;
            }

            .profile-grid {
                grid-template-columns: 1fr 1fr;
            }

            header {
                padding: 20px;
            }

            main {
                width: 94%;
            }
        }

        @media (max-width: 450px) {

            .profile-grid {
                grid-template-columns: 1fr;
            }

            .welcome h1 {
                font-size: 25px;
            }
        }

    </style>
</head>

<body>

<header>

    <div class="logo">
        HycalPro
    </div>

    <div class="user-name" id="headerName">
        User
    </div>

</header>


<main>

    <!-- WELCOME -->

    <section class="welcome">

        <h1>
            Hello, <span id="name">User</span> 👋
        </h1>

        <p>
            Here's your personalized health dashboard.
        </p>

    </section>


    <!-- SUMMARY -->

    <section class="cards">

        <div class="card">

            <div class="card-title">
                💧 Daily Water Goal
            </div>

            <div class="card-value">
                <span id="waterGoal">0</span> L
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                🥩 Daily Protein Goal
            </div>

            <div class="card-value">
                <span id="proteinGoal">0</span> g
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                🎯 Your Goal
            </div>

            <div class="card-value" id="goal">
                -
            </div>

        </div>

    </section>


    <!-- PROFILE -->

    <section class="profile">

        <h2>Your Profile</h2>

        <div class="profile-grid">

            <div class="profile-item">
                <span>Name</span>
                <strong id="profileName">-</strong>
            </div>

            <div class="profile-item">
                <span>Age</span>
                <strong id="profileAge">-</strong>
            </div>

            <div class="profile-item">
                <span>Height</span>
                <strong id="profileHeight">-</strong>
            </div>

            <div class="profile-item">
                <span>Weight</span>
                <strong id="profileWeight">-</strong>
            </div>

        </div>

    </section>


    <!-- ROUTINE -->

    <section class="routine">

        <div class="routine-header">

            <h2>Today's Routine</h2>

            <button class="add-btn">
                + Add Routine
            </button>

        </div>


        <div class="empty">

            <div class="empty-icon">
                📋
            </div>

            <h3>No routines added yet</h3>

            <p>
                Create your first protein or water routine.
            </p>

        </div>

    </section>

</main>


<script>

    // Get saved user data
    const savedUser = localStorage.getItem("hycalproUser");

    // If user has not completed profile setup
    if (!savedUser) {

        window.location.href = "login.html";

    } else {

        const user = JSON.parse(savedUser);

        // Header
        document.getElementById("headerName").textContent = user.name;

        // Welcome
        document.getElementById("name").textContent = user.name;

        // Goals
        document.getElementById("waterGoal").textContent = user.waterGoal;
        document.getElementById("proteinGoal").textContent = user.proteinGoal;

        // Goal
        const goalNames = {
            "muscle-gain": "Build Muscle",
            "weight-loss": "Lose Weight",
            "maintenance": "Maintain",
            "healthy-lifestyle": "Healthy Lifestyle"
        };

        document.getElementById("goal").textContent =
            goalNames[user.goal] || user.goal;

        // Profile
        document.getElementById("profileName").textContent = user.name;
        document.getElementById("profileAge").textContent = user.age + " years";
        document.getElementById("profileHeight").textContent = user.height + " cm";
        document.getElementById("profileWeight").textContent = user.weight + " kg";

    }

</script>

</body>
</html>
